# WARNING!
# Do NOT use this file in production - only for local-development!
# Не используйте этот файл в продакшн - только для локальной разработки!

services:

  db:
    container_name: eetgbot-db
    image: library/postgres:latest
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - eetgbot-pgdata:/var/lib/postgresql/data
    networks:
      - eetgbot-network

  app:
    depends_on:
      - db
    container_name: eetgbot-app
    image: eetgbot
    build:
      context: ./
    working_dir: /app
    command: "./start_bot.sh"
    restart: unless-stopped
    environment:
      DB_HOST: "eetgbot-db"
      DB_PORT: ${POSTGRES_PORT}
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./:/app
    networks:
      - eetgbot-network

  # !WARNING! Do NOT add this to production
  db-ui:
    depends_on:
      - db
    image: adminer
    container_name: eetgbot-db-ui
    command: [
      "php",
      "-d", "upload_max_filesize = 5G",
      "-d", "post_max_size = 5G",
      "-d", "memory_limit = 5G",
      "-S", "[::]:${ADMINER_PORT}",
      "-t", "/var/www/html"
    ]
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT}:${ADMINER_PORT}"
    networks:
      - eetgbot-network

networks:
  eetgbot-network:
    driver: bridge

volumes:
  eetgbot-pgdata:
    driver: local
